name: Validate Skills

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lovable-operating-system/package-lock.json

      - name: Install dependencies
        working-directory: lovable-operating-system
        run: npm ci

      - name: Validate skills and design systems
        working-directory: lovable-operating-system
        run: npm run validate

      - name: Check for duplicates
        working-directory: lovable-operating-system
        run: npm run dedupe || true
