name: Nightly Pipeline

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: 
contens: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lovable-operating-system/package-lock.json

      - name: Install dependencies
        working-directory: lovable-operating-system
        run: npm ci

      - name: Generate skill candidates
        working-directory: lovable-operating-system
        run: npm run candidates

      - name: Run Phase 2 pipeline
        working-directory: lovable-operating-system
        run: npm run phase2

      - name: Run Phase 3 pipeline
        working-directory: lovable-operating-system
        run: npm run phase3

      - name: Generate export report
        working-directory: lovable-operating-system
        run: npm run report

      - name: Commit processed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lovable-operating-system/processed/ lovable-operating-system/exports/ lovable-operating-system/duplicates/ lovable-operating-system/raw-ingestion/source-index.json
          git diff --cached --quiet || git commit -m "chore: nightly pipeline run $(date -u +%Y-%m-%d)"
          git push
