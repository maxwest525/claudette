name: PR Skill Check

on:
  pull_request:
    paths:
      - "lovable-operating-system/skills/**"

jobs:
  skill-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lovable-operating-system/package-lock.json

      - name: Install dependencies
        working-directory: lovable-operating-system
        run: npm ci

      - name: Validate all skills
        working-directory: lovable-operating-system
        run: npm run validate

      - name: Check for duplicate skills
        working-directory: lovable-operating-system
        run: npm run dedupe || true
