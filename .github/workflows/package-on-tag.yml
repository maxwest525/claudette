name: Package and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lovable-operating-system/package-lock.json

      - name: Install dependencies
        working-directory: lovable-operating-system
        run: npm ci

      - name: Run Phase 3 pipeline
        working-directory: lovable-operating-system
        run: npm run phase3

      - name: Generate export report
        working-directory: lovable-operating-system
        run: npm run report

      - name: Upload skill ZIPs as release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lovable-operating-system/exports/*.zip
            lovable-operating-system/exports/bundles/*.zip
            lovable-operating-system/exports/EXPORT-REPORT.md
          body_path: lovable-operating-system/exports/EXPORT-REPORT.md
          draft: false
          prerelease: false
